name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NYC_TAXI_DATA_MODE: sample
      MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/mlflow-ci.db
      MLFLOW_DISABLE_AGENT_HINT: "1"
      DVC_NO_ANALYTICS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev-lock.txt

      - name: Check formatting
        run: python -m black --check src tests

      - name: Run linter
        run: python -m flake8 --config=.flake8 src tests

      - name: Run security checks
        run: python -m bandit -q -r src

      - name: Run tests
        run: python -m pytest -q

      - name: Reproduce ML pipeline
        run: |
          python -m dvc repro --force
          python -m dvc status

      - name: Build Docker image
        run: docker build --build-arg NYC_TAXI_DATA_MODE=sample -t nyc-taxi-demand-api:ci .

      - name: Smoke-test Docker inference
        run: |
          docker run --rm -d --name nyc-taxi-api-ci -p 8000:8000 nyc-taxi-demand-api:ci
          trap 'docker logs nyc-taxi-api-ci; docker stop nyc-taxi-api-ci' EXIT
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:8000/health/ready
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"pu_location_id":161,"temperature_2m":20,"relative_humidity_2m":60,"precipitation":0,"weather_code":0,"wind_speed_10m":10,"hour":18,"day_of_week":2,"day_of_month":15,"month":6,"is_weekend":0,"lag_1h":120,"lag_24h":110,"lag_168h":100,"rolling_mean_24h":105}' \
            http://127.0.0.1:8000/predict

      - name: Validate Docker Compose
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize infra/k8s | docker run --rm -i \
            ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary
          kubectl kustomize infra/k8s/overlays/local | docker run --rm -i \
            ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary
