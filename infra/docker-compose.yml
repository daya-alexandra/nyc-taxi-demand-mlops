services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: nyc-taxi-demand-api:latest
    container_name: nyc-taxi-demand-api
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      NYC_TAXI_DATA_MODE: sample
      RETRAIN_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
      trainer:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  trainer:
    image: nyc-taxi-demand-api:latest
    container_name: nyc-taxi-demand-trainer
    command:
      - python
      - -m
      - dvc
      - repro
      - --force
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      NYC_TAXI_DATA_MODE: sample
      DVC_NO_ANALYTICS: "1"
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.11.1
    container_name: nyc-taxi-demand-mlflow
    entrypoint:
      - mlflow
    command:
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - mlflow-artifacts:/
      - --artifacts-destination
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - "mlflow:*,localhost:*,127.0.0.1:*"
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data-v2:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: nyc-taxi-demand-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: nyc-taxi-demand-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mlflow-data-v2: