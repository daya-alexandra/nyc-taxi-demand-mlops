apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: nyc-taxi-demand
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: nyc-taxi-demand
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: NYC Taxi Demand
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: nyc-taxi-demand
data:
  nyc-taxi-demand.json: |
    {
      "title": "NYC Taxi Demand MLOps",
      "uid": "nyc-taxi-demand-mlops",
      "schemaVersion": 40,
      "refresh": "10s",
      "panels": [
        {
          "type": "stat",
          "title": "Model available",
          "id": 1,
          "datasource": "Prometheus",
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 0},
          "targets": [{"expr": "taxi_model_available", "refId": "A"}]
        },
        {
          "type": "stat",
          "title": "Prediction requests",
          "id": 2,
          "datasource": "Prometheus",
          "gridPos": {"h": 6, "w": 8, "x": 8, "y": 0},
          "targets": [{"expr": "taxi_prediction_requests_total", "refId": "A"}]
        },
        {
          "type": "timeseries",
          "title": "Prediction latency p95",
          "id": 3,
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 6},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(taxi_prediction_latency_seconds_bucket[5m]))",
              "refId": "A"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: nyc-taxi-demand
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.1
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboard
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: grafana-dashboard
          configMap:
            name: grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: nyc-taxi-demand
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
