apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: nyc-taxi-demand
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.11.1
          command:
            - mlflow
          args:
            - server
            - --backend-store-uri
            - sqlite:////mlflow/mlflow.db
            - --default-artifact-root
            - mlflow-artifacts:/
            - --artifacts-destination
            - /mlflow/artifacts
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --allowed-hosts
            - "mlflow:*,localhost:*,127.0.0.1:*"
          ports:
            - name: http
              containerPort: 5000
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlflow
          readinessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: "127.0.0.1:5000"
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: mlflow-data
          persistentVolumeClaim:
            claimName: mlflow-data
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: nyc-taxi-demand
spec:
  type: NodePort
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: nyc-taxi-demand
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
