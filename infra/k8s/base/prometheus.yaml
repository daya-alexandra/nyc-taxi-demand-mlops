apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: nyc-taxi-demand
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: nyc-taxi-demand-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - nyc-taxi-demand-api:8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: nyc-taxi-demand
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: nyc-taxi-demand
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
